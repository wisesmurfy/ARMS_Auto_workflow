[project]
name = "evidos"
version = "0.1.0"
description = "ARMS EvidOS: topic -> 3-Part outline options -> human selection (LLM workflow)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",    # LLM 호출: Claude API (ADR-0004)
    "pydantic>=2.7",       # 데이터 모양(스키마) 정의·검사
    "python-dotenv>=1.0",  # .env에서 API 키 읽기
]

[build-system]  # src/evidos를 패키지로 설치해 `import evidos`가 되게 한다
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",         # 코드 테스트
    "ruff>=0.5",           # 린트 + 포맷
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/design"]  # 승인된 설계 스냅샷은 수정 금지 (md 안 코드 블록 포맷 방지)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # 기본 오류 · import 정렬 · 최신 문법 · 흔한 버그

[tool.pytest.ini_options]
testpaths = ["tests"]
